# Render one-click backend deploy for Table Tap API.
# Dashboard alternative: New → Web Service → select repo → Root Directory = server,
# Build Command = npm install, Start Command = npm start, then add env vars below.
services:
  - type: web
    name: table-tap-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        value: http://localhost:5173,https://table-tap-1vrp.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
